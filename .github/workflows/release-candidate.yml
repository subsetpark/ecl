# Tier 3: intentionally manual and exhaustive. Each build type keeps its own
# runner so its dependent checks reuse one Zig cache and emitted artifacts.
name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safe-oom:
    name: ReleaseSafe OOM
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: ReleaseSafe
      run_oom: true

  release-fast:
    name: Complete ReleaseFast suite
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: ReleaseFast
      run_full_suite: true
      run_repl: true
      run_native_acceptance: true
