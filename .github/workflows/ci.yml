# Tier 2 of three. Pull requests run the local Debug tier, one complete
# ReleaseSafe suite, and the checks too slow or too platform-bound to run
# locally on every change: ThreadSanitizer, the idiom differential, and the
# core and surface allocation-failure sweeps. Merges and manual runs add the
# broad per-build-type matrix. Tier 3 lives in release-candidate.yml.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug tiers
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: debug
      run_precommit: ${{ github.event_name == 'pull_request' }}
      run_quality: ${{ github.event_name != 'pull_request' }}
      run_full_suite: ${{ github.event_name != 'pull_request' }}
      run_public_ecl_format: true
      run_native_negative: true
      run_repl: ${{ github.event_name != 'pull_request' }}
      run_fuzz: ${{ github.event_name != 'pull_request' }}
      run_differential: true
      run_tsan: true

  release-safe:
    name: ReleaseSafe tiers
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: safe
      run_full_suite: true
      run_repl: true
      run_native_acceptance: true
      run_memcheck: true
      run_workers_eight: ${{ github.event_name != 'pull_request' }}
      run_performance_smoke: true

  oom-compile:
    name: Compile shared OOM artifact
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: safe
      cache_scope: oom
      run_oom: true
      oom_target: test-oom-compile

  oom-core:
    name: Core OOM sweep
    if: github.event_name == 'pull_request'
    needs: oom-compile
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: safe
      cache_scope: oom
      run_oom: true
      oom_target: test-oom-core

  oom-surfaces:
    name: Standard-library and host OOM surfaces
    if: github.event_name == 'pull_request'
    needs: oom-compile
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: safe
      cache_scope: oom
      run_oom: true
      oom_target: test-oom-surfaces

  release-fast:
    name: ReleaseFast smoke
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: fast
      run_snapshots: true

  git-macos:
    name: Git packages and snapshot extension on macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, platform, subprocess, urllib.request
          architecture = 'aarch64' if platform.machine() == 'arm64' else 'x86_64'
          expected = {'aarch64': 'b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a', 'x86_64': '4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6'}
          archive = pathlib.Path('/tmp/zig.tar.xz')
          with urllib.request.urlopen(f'https://ziglang.org/download/0.17.0/zig-{architecture}-macos-0.17.0.tar.xz', timeout=60) as response:
              archive.write_bytes(response.read())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected[architecture]
          pathlib.Path('/tmp/zig').mkdir(exist_ok=True)
          subprocess.run(['tar', '-C', '/tmp/zig', '--strip-components=1', '-xf', str(archive)], stdin=subprocess.DEVNULL, timeout=60, check=True)
          PYTHON
      - name: Build and exercise HTTPS packages
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          # Zig's ZIP dependency downloader needs tmp even on a cold cache.
          pathlib.Path(os.environ['ZIG_GLOBAL_CACHE_DIR'], 'tmp').mkdir(parents=True, exist_ok=True)
          subprocess.run(['/tmp/zig/zig', 'build', 'test-pkg-git', '-Doptimize=safe'], stdin=subprocess.DEVNULL, timeout=900, check=True)
          subprocess.run(['/tmp/zig/zig', 'build', 'test-git-extension', 'test-pkg-fetch', '-Doptimize=safe'], stdin=subprocess.DEVNULL, timeout=900, check=True)
          PYTHON
