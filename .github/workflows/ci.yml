# Tier 2 of three. Pull requests run the local Debug tier plus one complete
# ReleaseSafe suite. Merges and manual runs add the broad per-build-type
# matrix. Tier 3 lives in release-candidate.yml.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug tiers
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: Debug
      run_precommit: ${{ github.event_name == 'pull_request' }}
      run_quality: ${{ github.event_name != 'pull_request' }}
      run_full_suite: ${{ github.event_name != 'pull_request' }}
      run_public_ecl_format: true
      run_native_negative: true
      run_repl: ${{ github.event_name != 'pull_request' }}
      run_fuzz: ${{ github.event_name != 'pull_request' }}
      run_differential: ${{ github.event_name != 'pull_request' }}
      run_tsan: ${{ github.event_name != 'pull_request' }}

  release-safe:
    name: ReleaseSafe tiers
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: ReleaseSafe
      run_full_suite: true
      run_repl: true
      run_native_acceptance: true
      run_workers_eight: ${{ github.event_name != 'pull_request' }}

  release-fast:
    name: ReleaseFast smoke
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-type.yml
    with:
      optimize: ReleaseFast
      run_snapshots: true
