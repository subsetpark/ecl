# A reusable build-type lane. Host-mounted local and global Zig caches survive
# its main glibc container, its separate TSan container, and later workflow
# jobs. Tiers in one invocation also keep one long-lived Ubuntu container.
name: Build type

on:
  workflow_call:
    inputs:
      optimize:
        description: Zig optimization mode
        required: true
        type: string
      cache_scope:
        description: Compilation-cache namespace for cooperating jobs
        default: build
        type: string
      run_precommit:
        default: false
        type: boolean
      run_quality:
        default: false
        type: boolean
      run_full_suite:
        default: false
        type: boolean
      run_public_ecl_format:
        default: false
        type: boolean
      run_native_negative:
        default: false
        type: boolean
      run_repl:
        default: false
        type: boolean
      run_native_acceptance:
        default: false
        type: boolean
      run_fuzz:
        default: false
        type: boolean
      run_workers_eight:
        default: false
        type: boolean
      run_differential:
        default: false
        type: boolean
      run_tsan:
        default: false
        type: boolean
      run_snapshots:
        default: false
        type: boolean
      run_oom:
        default: false
        type: boolean
      oom_target:
        default: test-oom
        type: string
      oom_filter:
        default: ""
        type: string
      run_performance_smoke:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Linux x86_64 / ${{ inputs.optimize }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      OPTIMIZE: ${{ inputs.optimize }}
      OOM_TARGET: ${{ inputs.oom_target }}
      OOM_FILTER: ${{ inputs.oom_filter }}
      PANT_VERSION: 0.24.0
      ZIG_VERSION: 0.16.0
      ZIG_GLOBAL_CACHE_HOST: /tmp/ecl-zig-cache/global
      ZIG_LOCAL_CACHE_HOST: /tmp/ecl-zig-cache/local

    steps:
      - name: Validate optimization mode
        run: |
          case "$OPTIMIZE" in
            Debug|ReleaseSafe|ReleaseFast) ;;
            *)
              echo "Unsupported optimization mode: $OPTIMIZE" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore Zig compilation artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ZIG_GLOBAL_CACHE_HOST }}
            ${{ env.ZIG_LOCAL_CACHE_HOST }}
          key: ecl-zig-${{ runner.os }}-x86_64-${{ env.ZIG_VERSION }}-pant-${{ env.PANT_VERSION }}-${{ inputs.optimize }}-${{ inputs.cache_scope }}-${{ github.sha }}
          restore-keys: |
            ecl-zig-${{ runner.os }}-x86_64-${{ env.ZIG_VERSION }}-pant-${{ env.PANT_VERSION }}-${{ inputs.optimize }}-${{ inputs.cache_scope }}-
            ecl-zig-${{ runner.os }}-x86_64-${{ env.ZIG_VERSION }}-pant-${{ env.PANT_VERSION }}-${{ inputs.optimize }}-

      - name: Set up Ubuntu and Zig
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_HOST/tmp" "$ZIG_LOCAL_CACHE_HOST"
          docker run --detach --name ecl-ci --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$ZIG_GLOBAL_CACHE_HOST:/root/.cache/zig" \
            --volume "$ZIG_LOCAL_CACHE_HOST:/build/.zig-cache" \
            ubuntu:24.04 tail -f /dev/null
          # PANT_VERSION is intentionally expanded inside the container.
          # shellcheck disable=SC2016
          timeout 15m docker exec --env OPTIMIZE="$OPTIMIZE" --env PANT_VERSION="$PANT_VERSION" ecl-ci sh -euxc '
            export DEBIAN_FRONTEND=noninteractive
            timeout 5m apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
            timeout 5m apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y --no-install-recommends \
              ca-certificates curl expect git libc6-dev python3 xz-utils z3
            curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
            mkdir -p /opt/zig /build /root/.cache/zig/tmp
            tar -C /opt/zig --strip-components=1 -xf /tmp/zig.tar.xz
            ln -s /opt/zig/zig /usr/local/bin/zig
            curl -fsSLo /tmp/pant.tar.gz https://github.com/subsetpark/pantagruel/releases/download/v$PANT_VERSION/pant-linux-x86_64.tar.gz
            echo "2ef13d67a597fd62f165a332e0dea37fe9ae206ec43f248af8c24501a0167221  /tmp/pant.tar.gz" | sha256sum -c -
            tar -C /usr/local/bin -xzf /tmp/pant.tar.gz
            pant --version
            cp -a /work/. /build/
            git config --global --add safe.directory /build
          ' < /dev/null

      - name: ThreadSanitizer
        if: inputs.run_tsan
        run: |
          set +e
          # OPTIMIZE is passed into the container.
          # shellcheck disable=SC2016
          timeout 25m docker run --rm --platform linux/amd64 \
            --env OPTIMIZE="$OPTIMIZE" \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$ZIG_GLOBAL_CACHE_HOST:/root/.cache/zig" \
            --volume "$ZIG_LOCAL_CACHE_HOST:/build/.zig-cache" \
            ubuntu:24.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git libc6-dev xz-utils
              curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
              echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
              mkdir -p /opt/zig /build /root/.cache/zig/tmp
              tar -C /opt/zig --strip-components=1 -xf /tmp/zig.tar.xz
              cp -a /work/. /build/
              cd /build
              timeout 20m /opt/zig/zig build test-tsan \
              -Doptimize="$OPTIMIZE" --summary all --test-timeout 10m \
                < /dev/null
          '
          tsan_status=$?
          set -e
          exit "$tsan_status"

      - name: Install zlint
        if: inputs.run_precommit || inputs.run_quality
        run: |
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc '
            curl -fsSLo /usr/local/bin/zlint https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64
            echo "3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /usr/local/bin/zlint" | sha256sum -c -
            chmod +x /usr/local/bin/zlint
          '

      - name: Precommit tier
        if: inputs.run_precommit
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build precommit
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m < /dev/null'

      - name: Quality gates
        if: inputs.run_quality
        run: |
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc '
            cd /build
            timeout 2m zig fmt --check . < /dev/null
            timeout 10m zig build check-ecl source-audit -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m < /dev/null
            git ls-files "*.zig" | timeout 5m zlint -S --deny-warnings
          '

      - name: Full suite
        if: inputs.run_full_suite
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 20m zig build test
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 10m < /dev/null'

      - name: WorkDriver benchmark smoke
        if: inputs.run_performance_smoke
        run: |
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc '
            cd /build
            output="$(mktemp)"
            trap "rm -f \"$output\"" EXIT
            set +e
            timeout 10m zig build bench-workdrivers -Doptimize="$OPTIMIZE" -- --quick < /dev/null > "$output" 2>&1
            benchmark_status=$?
            set -e
            if [ "$benchmark_status" -ne 0 ]; then
              cat "$output"
              exit "$benchmark_status"
            fi
            grep -qx "# schema=ecl.workdrivers.timing.v6" "$output"
            grep -qx "# schema=ecl.workdrivers.counters.v6" "$output"
          '

      # check-ecl validates the same corpus in-process. This additionally
      # exercises the installed formatter through its public CLI surface.
      - name: Check ECL formatting through installed binary
        if: inputs.run_public_ecl_format
        run: |
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc '
            cd /build
            timeout 10m zig build -Doptimize="$OPTIMIZE" --summary all < /dev/null
            formatted="$(mktemp)"
            trap "rm -f \"$formatted\"" EXIT
            git ls-files "*.ecl" ":!:test/acceptance/load-parse-error.ecl" |
              while IFS= read -r source; do
                timeout 30s ./zig-out/bin/ecl fmt "$source" < /dev/null > "$formatted"
                if ! cmp -s "$source" "$formatted"; then
                  diff -u "$source" "$formatted" || true
                  echo "ecl fmt check failed: $source" >&2
                  exit 1
                fi
              done
          '

      - name: Native SDK compile-time rejections
        if: inputs.run_native_negative
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build test-native-sdk-negative
          -Doptimize="$OPTIMIZE" --summary all < /dev/null'

      - name: REPL under a PTY
        if: inputs.run_repl
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build test-repl
          -Doptimize="$OPTIMIZE" --summary all < /dev/null'

      # The filtered native tests in src/root.zig are already part of the full
      # suite. Only run the standalone CLI acceptance root here.
      - name: Standalone native acceptance
        if: inputs.run_native_acceptance
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build test-native-acceptance
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m < /dev/null'

      - name: Fuzz campaigns
        if: inputs.run_fuzz
        run: |
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc '
            cd /build
            for target in render-cursor reader formatter editor completion history pending scheduler native-descriptor native-call; do
              timeout 10m zig build "fuzz-$target" -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m --fuzz=100 < /dev/null
            done
          '

      - name: Eight-worker concurrency
        if: inputs.run_workers_eight
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 15m zig build test-workers-8
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 10m < /dev/null'

      - name: Idiom differential
        if: inputs.run_differential
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build differential
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m < /dev/null'

      - name: Reference snapshots
        if: inputs.run_snapshots
        run: >-
          docker exec --env OPTIMIZE="$OPTIMIZE" ecl-ci sh -euxc
          'cd /build; timeout 10m zig build test-snapshots
          -Doptimize="$OPTIMIZE" --summary all --test-timeout 5m < /dev/null'

      - name: Initialized-Session OOM sweep
        if: inputs.run_oom
        run: |
          docker exec \
            --env OPTIMIZE="$OPTIMIZE" \
            --env OOM_TARGET="$OOM_TARGET" \
            --env OOM_FILTER="$OOM_FILTER" \
            ecl-ci sh -euxc '
              cd /build
              if [ -n "$OOM_FILTER" ]; then
                timeout 30m zig build "$OOM_TARGET" \
                  -Doptimize="$OPTIMIZE" "-Doom-filter=$OOM_FILTER" \
                  --summary all --test-timeout 25m < /dev/null
              else
                timeout 30m zig build "$OOM_TARGET" \
                  -Doptimize="$OPTIMIZE" \
                  --summary all --test-timeout 25m < /dev/null
              fi
            '

      - name: Stop Ubuntu container
        if: always()
        run: docker rm --force ecl-ci || true
