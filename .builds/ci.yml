image: alpine/latest
packages:
  - curl
  - xz
  # Zig builds libtsan/libcxx from source for -fsanitize=thread; that
  # compilation requires the Linux UAPI headers (linux/futex.h et al.).
  - linux-headers
  - expect
sources:
  - https://git.sr.ht/~subsetpark/ecl
tasks:
  - toolchain: |
      set -eu
      set -o pipefail
      curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | sha256sum -c -
      mkdir -p "$HOME/.local"
      tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
      echo 'export PATH="$HOME/.local/zig-x86_64-linux-0.16.0:$PATH"' >> "$HOME/.buildenv"
      # Zig 0.16's ZIP fetcher creates files below the global-cache tmp
      # directory without first creating that directory.
      mkdir -p "$HOME/.cache/zig/tmp"
  - fmt: |
      set -eu
      set -o pipefail
      cd ecl
      zig fmt --check .
  - fmt-ecl: |
      set -eu
      set -o pipefail
      cd ecl
      zig build
      formatted="$(mktemp)"
      trap 'rm -f "$formatted"' EXIT
      # This parser fixture is deliberately invalid input, so it has no canonical format.
      git ls-files '*.ecl' ':!:test/acceptance/load-parse-error.ecl' |
        while IFS= read -r source; do
          ./zig-out/bin/ecl fmt "$source" > "$formatted"
          if ! cmp -s "$source" "$formatted"; then
            diff -u "$source" "$formatted" || true
            echo "ecl fmt check failed: $source" >&2
            exit 1
          fi
        done
  - test: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test
  - test-safe: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test -Doptimize=ReleaseSafe
  - test-fast: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test -Doptimize=ReleaseFast
  - test-repl: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test-repl
      zig build test-repl -Doptimize=ReleaseSafe
  - native: |
      set -eu
      set -o pipefail
      cd ecl
      zig build native-fixture
      zig build test-native-sdk-negative
      zig build test-native-runtime
      zig build test-native-runtime -Doptimize=ReleaseSafe
  - fuzz: |
      set -eu
      set -o pipefail
      cd ecl
      for target in reader formatter editor completion history pending scheduler native-descriptor native-call; do
        zig build "fuzz-$target" --fuzz=100
      done
  - test-workers: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test-workers -Doptimize=ReleaseSafe
  - test-oom: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test-oom
  - differential: |
      set -eu
      set -o pipefail
      cd ecl
      zig build differential
  - test-tsan: |
      set -eu
      set -o pipefail
      cd ecl
      zig build test-tsan
  - lint: |
      set -eu
      set -o pipefail
      curl -fsSLo /tmp/zlint https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64
      echo '3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /tmp/zlint' | sha256sum -c -
      chmod +x /tmp/zlint
      cd ecl
      git ls-files '*.zig' | /tmp/zlint -S --deny-warnings
  - acceptance: |
      set -eu
      set -o pipefail
      cd ecl
      zig build acceptance -Doptimize=ReleaseSafe
