image: alpine/latest
packages:
  - curl
  - xz
  # Zig builds libtsan/libcxx from source for -fsanitize=thread; that
  # compilation requires the Linux UAPI headers (linux/futex.h et al.).
  - linux-headers
  - expect
sources:
  - https://git.sr.ht/~subsetpark/ecl
tasks:
  - toolchain: |
      set -eu
      set -o pipefail
      curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | sha256sum -c -
      mkdir -p "$HOME/.local"
      tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
      echo 'export PATH="$HOME/.local/zig-x86_64-linux-0.16.0:$PATH"' >> "$HOME/.buildenv"
      # Zig 0.16's ZIP fetcher creates files below the global-cache tmp
      # directory without first creating that directory.
      mkdir -p "$HOME/.cache/zig/tmp"
  - fmt: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 2m zig fmt --check . < /dev/null
  - fmt-ecl: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 10m zig build < /dev/null
      formatted="$(mktemp)"
      trap 'rm -f "$formatted"' EXIT
      # This parser fixture is deliberately invalid input, so it has no canonical format.
      git ls-files '*.ecl' ':!:test/acceptance/load-parse-error.ecl' |
        while IFS= read -r source; do
          timeout 30s ./zig-out/bin/ecl fmt "$source" < /dev/null > "$formatted"
          if ! cmp -s "$source" "$formatted"; then
            diff -u "$source" "$formatted" || true
            echo "ecl fmt check failed: $source" >&2
            exit 1
          fi
        done
  - test: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 15m zig build test < /dev/null
  - test-safe: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 15m zig build test -Doptimize=ReleaseSafe < /dev/null
  - smoke-fast: |
      set -eu
      set -o pipefail
      cd ecl
      # ReleaseFast removes checks rather than adding an analysis, and is not
      # the distributed mode. Compile the real binary and exercise the broad
      # promoted CLI transcript here; the full ReleaseFast suite belongs to
      # the release-candidate matrix.
      timeout 10m zig build test-snapshots -Doptimize=ReleaseFast < /dev/null
  - test-repl: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 10m zig build test-repl < /dev/null
      timeout 10m zig build test-repl -Doptimize=ReleaseSafe < /dev/null
  - native: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 10m zig build native-fixture < /dev/null
      timeout 10m zig build test-native-sdk-negative < /dev/null
      timeout 10m zig build test-native-runtime < /dev/null
      timeout 10m zig build test-native-runtime -Doptimize=ReleaseSafe < /dev/null
  - fuzz: |
      set -eu
      set -o pipefail
      cd ecl
      for target in reader formatter editor completion history pending scheduler native-descriptor native-call; do
        timeout 10m zig build "fuzz-$target" --fuzz=100 < /dev/null
      done
  - test-workers: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 15m zig build test-workers -Doptimize=ReleaseSafe < /dev/null
  - differential: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 10m zig build differential < /dev/null
  - test-tsan: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 20m zig build test-tsan < /dev/null
  - lint: |
      set -eu
      set -o pipefail
      curl -fsSLo /tmp/zlint https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64
      echo '3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /tmp/zlint' | sha256sum -c -
      chmod +x /tmp/zlint
      cd ecl
      git ls-files '*.zig' | timeout 5m /tmp/zlint -S --deny-warnings
  - acceptance: |
      set -eu
      set -o pipefail
      cd ecl
      timeout 10m zig build acceptance -Doptimize=ReleaseSafe < /dev/null
